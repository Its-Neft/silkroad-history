<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura distribuida de servidores de Joymax</title>
  <desc id="desc">Diagrama por capas del cliente Silkroad, GatewayServer, AgentServer, SR GameServer, servicios de control y bases de datos.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#101722"/><stop offset="1" stop-color="#192536"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d8ae52"/><stop offset="1" stop-color="#8e651d"/></linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#59b6a1"/><stop offset="1" stop-color="#246f70"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#02060d" flood-opacity=".45"/></filter>
    <marker id="arrowGold" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#d8ae52"/></marker>
    <marker id="arrowTeal" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0 9 4.5 0 9Z" fill="#59b6a1"/></marker>
    <style>
      .label{font:700 16px Inter,Segoe UI,sans-serif;letter-spacing:1.7px;fill:#e7c46e}
      .small{font:500 15px Inter,Segoe UI,sans-serif;fill:#bac7d7}
      .tiny{font:500 13px Inter,Segoe UI,sans-serif;fill:#8395aa}
      .title{font:700 25px Georgia,serif;letter-spacing:3px;fill:#f2e8cc}
      .box{fill:#182332;stroke:#41546a;stroke-width:1.5}
      .box-gold{fill:#202a35;stroke:#bd9140;stroke-width:2}
      .box-teal{fill:#172c32;stroke:#4eaa9a;stroke-width:2}
      .wire{fill:none;stroke:#d8ae52;stroke-width:2.5;marker-end:url(#arrowGold)}
      .wire-teal{fill:none;stroke:#59b6a1;stroke-width:2.5;marker-end:url(#arrowTeal)}
      .dash{stroke-dasharray:8 8}
    </style>
  </defs>
  <rect width="1400" height="760" rx="24" fill="url(#bg)"/>
  <path d="M50 115H1350" stroke="#d8ae52" opacity=".25"/>
  <text x="70" y="72" class="label">ARQUITECTURA DISTRIBUIDA · JOYMAX</text>
  <text x="70" y="102" class="title">De la sesión del jugador al mundo persistente</text>

  <text x="70" y="155" class="tiny">01 · ACCESO Y SESIÓN</text>
  <rect x="70" y="177" width="280" height="112" rx="16" class="box-gold" filter="url(#shadow)"/>
  <text x="98" y="215" class="label">CLIENTE SRO</text>
  <text x="98" y="244" class="small">Login · cola · handshake</text>
  <text x="98" y="270" class="tiny">sro_client.exe / PK2 / Blowfish</text>

  <rect x="455" y="177" width="280" height="112" rx="16" class="box-gold" filter="url(#shadow)"/>
  <text x="483" y="215" class="label">GATEWAYSERVER</text>
  <text x="483" y="244" class="small">Puerto 15779 · sesión inicial</text>
  <text x="483" y="270" class="tiny">Autenticación y selección de shard</text>

  <rect x="840" y="177" width="280" height="112" rx="16" class="box-gold" filter="url(#shadow)"/>
  <text x="868" y="215" class="label">AGENTSERVER</text>
  <text x="868" y="244" class="small">Multiplexor de tráfico</text>
  <text x="868" y="270" class="tiny">Puente entre sesión y mundo</text>

  <path d="M350 233H448" class="wire"/><text x="371" y="220" class="tiny">TCP</text>
  <path d="M735 233H833" class="wire"/><text x="756" y="220" class="tiny">sesión verificada</text>

  <text x="70" y="360" class="tiny">02 · SIMULACIÓN Y SERVICIOS DE CONTROL</text>
  <rect x="70" y="382" width="440" height="132" rx="16" class="box-teal" filter="url(#shadow)"/>
  <text x="100" y="422" class="label">SR_GAME_SERVER</text>
  <text x="100" y="451" class="small">Mundo · combate · física · NPCs</text>
  <text x="100" y="479" class="tiny">Estado vivo del shard y reglas de juego</text>
  <rect x="570" y="382" width="250" height="132" rx="16" class="box"/>
  <text x="600" y="422" class="label">GLOBALMANAGER</text>
  <text x="600" y="451" class="small">Orquestador del clúster</text>
  <text x="600" y="479" class="tiny">Registro y coordinación</text>
  <rect x="880" y="382" width="250" height="132" rx="16" class="box"/>
  <text x="910" y="422" class="label">MACHINEMANAGER</text>
  <text x="910" y="451" class="small">Monitoreo de host</text>
  <text x="910" y="479" class="tiny">Salud de procesos y máquina</text>
  <rect x="1190" y="382" width="140" height="132" rx="16" class="box"/>
  <text x="1212" y="422" class="label" font-size="13">CERT</text>
  <text x="1212" y="451" class="small">Auth de</text><text x="1212" y="475" class="small">procesos</text>

  <path d="M980 289V340H290V375" class="wire-teal"/>
  <path d="M980 289V340H695V375" class="wire-teal dash"/>
  <path d="M980 289V340H1005V375" class="wire-teal dash"/>
  <path d="M980 289V340H1260V375" class="wire-teal dash"/>
  <text x="1000" y="326" class="tiny">routing interno</text>

  <text x="70" y="590" class="tiny">03 · PERSISTENCIA</text>
  <rect x="70" y="612" width="1260" height="94" rx="16" class="box-gold" filter="url(#shadow)"/>
  <text x="105" y="651" class="label">MICROSOFT SQL SERVER</text>
  <text x="105" y="680" class="small">SRO_VT_ACCOUNT</text>
  <text x="380" y="680" class="small">SRO_VT_SHARD</text>
  <text x="620" y="680" class="small">SRO_VT_LOG</text>
  <text x="900" y="651" class="tiny">cuentas · mundo · economía · auditoría</text>
  <path d="M290 514V580H360V605" class="wire"/>
  <path d="M695 514V580H520V605" class="wire"/>
  <path d="M1005 514V580H680V605" class="wire"/>
</svg>
